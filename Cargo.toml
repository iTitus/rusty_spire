[package]
name = "rusty_spire"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
image = "0.25"
dds = "0.2" # required until image and image-extras support mipmaps
# image-extras = { version = "0.1", features = ["dds"], default-features = false }
thiserror = "2"
itertools = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
steamlocate = "2"
indexmap = "2"
bitflags = { version = "2", features = ["std"] }
num_enum = "0.7"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
